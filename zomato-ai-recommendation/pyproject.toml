[project]
name = "zomato-ai-recommendation"
version = "0.1.0"
description = "AI-powered restaurant recommendations from Zomato-style data + LLM."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
